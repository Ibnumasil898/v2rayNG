name: Build v2rayNG ARM64 Debug

on:
  workflow_dispatch:
  push:
    branches:
      - indonesia-2.2.6
    paths:
      - 'V2rayNG/**'
      - 'AndroidLibXrayLite/**'
      - 'hev-socks5-tunnel/**'
      - 'compile-hevtun.sh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: V2rayNG/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865"

          # accept licenses in case it's required
          yes | sdkmanager --licenses || true

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build libhevtun
        run: |
          set -euxo pipefail
          bash -x compile-hevtun.sh

      - name: Copy libhevtun
        run: |
          if [ -d libs ]; then
            cp -r libs "$GITHUB_WORKSPACE/V2rayNG/app/"
            echo "Copied libs to V2rayNG/app/"
            ls -la V2rayNG/app/libs || true
          else
            echo "ERROR: libs directory not found after compile-hevtun.sh"
            ls -la
            exit 1
          fi

      - name: Get AndroidLibXrayLite tag
        run: |
          set -eux
          cd AndroidLibXrayLite
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            CURRENT_TAG=$(git describe --tags --abbrev=0)
          else
            echo "No tag found; falling back to branch name"
            CURRENT_TAG=$(git rev-parse --abbrev-ref HEAD)
          fi
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "CURRENT_TAG is $CURRENT_TAG"

      - name: Ensure libs dir exists for AAR
        run: mkdir -p V2rayNG/app/libs

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Debug environment & files
        run: |
          echo "=== Java & Gradle ==="
          java -version || true
          ./gradlew -v || true
          echo "=== Android SDK vars ==="
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "NDK_HOME=${NDK_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "=== repo tree (top-level) ==="
          ls -la
          echo "=== AndroidLibXrayLite dir listing ==="
          ls -la AndroidLibXrayLite || true
          echo "=== CURRENT_TAG ==="
          echo "${CURRENT_TAG}"
          echo "=== libs dir (from hevtun) ==="
          ls -la libs || true
          echo "=== V2rayNG/app/libs target ==="
          ls -la V2rayNG/app || true

      - name: Build Debug APK
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          find V2rayNG/app/build/outputs/apk \
            -type f -name '*.apk' -print
          test -n "$(find V2rayNG/app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-debug-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
