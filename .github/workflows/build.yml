name: Build v2rayNG ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - indonesia-2.2.6
    paths:
      - 'V2rayNG/**'
      - 'AndroidLibXrayLite/**'
      - 'hev-socks5-tunnel/**'
      - 'compile-hevtun.sh'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: V2rayNG/**/gradle-wrapper.properties

      - name: Install Android SDK packages and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Configure NDK version
        working-directory: V2rayNG
        run: |
          if [ -f app/build.gradle.kts ]; then
            if ! grep -q 'ndkVersion' app/build.gradle.kts; then
              sed -i '/android[[:space:]]*{/a\    ndkVersion = "29.0.14206865"' app/build.gradle.kts
            fi
          elif [ -f app/build.gradle ]; then
            if ! grep -q 'ndkVersion' app/build.gradle; then
              sed -i "/android[[:space:]]*{/a\\    ndkVersion '29.0.14206865'" app/build.gradle
            fi
          fi

      - name: Build libhevtun
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: |
          test -d libs
          cp -r libs "$GITHUB_WORKSPACE/V2rayNG/app/"

      - name: Fetch AndroidLibXrayLite tag
        run: |
          cd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Build ARM64 debug APK
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: List APK output
        run: |
          find V2rayNG/app/build/outputs/apk \
            -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-arm64-debug
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
